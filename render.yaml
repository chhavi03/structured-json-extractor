services:
  - type: web
    name: structured-json-extractor
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    port: 8501
    envVars:
      - key: GOOGLE_API_KEY
        sync: false # Set securely in the Render dashboard
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///database.db
